<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rhythm Game Launcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="launcher">

        <h1>Rhythm Game Launcher</h1>

        <div class="content">

            <!-- ゲーム一覧 -->
            <div class="games">

                <button class="game-button available"
                        onclick="openGame('Built_to_Scale2')">

                    <span class="game-name">
                        Built to Scale 2
                    </span>

                    <span class="record" id="built-record"></span>

                </button>


                <button class="game-button coming-soon"
                        onclick="showComingSoon('Terrible Ninja')">

                    <span class="game-name">
                        Terrible Ninja
                    </span>

                </button>

            </div>


            <!-- Ranking -->
            <div class="ranking">

                <h2>Ranking</h2>

                <div class="ranking-box">
                    <span>(Ranking content)</span>
                </div>

            </div>

        </div>

    </div>


    <!-- 作成中メッセージ -->
    <div id="overlay" class="overlay">

        <div id="coming-message" class="coming-message">
            Terrible Ninjaは作成中です
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
