<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リズムゲームセレクト</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="launcher-body">
    <div class="launcher-container">
        <header class="launcher-header">
            <div>
                <p class="launcher-kicker">RHYTHM GAME COLLECTION</p>
                <h1>ゲームセレクト</h1>
            </div>
            <div class="player-chip" aria-label="ログイン中のユーザー">
                <span class="player-chip-icon">♪</span>
                <span id="displayUsername"></span>
            </div>
        </header>

        <main class="launcher-content">
            <p class="select-message">あそびたいゲームをえらんでね！</p>

            <div class="games-list">
                <div class="game-slot" id="slot-built_to_scale2">
                    <button
                        type="button"
                        class="game-card game-card-built rank-redo"
                        onclick="launchGame('built_to_scale2')"
                        aria-label="Built to Scale 2を開始">
                        <span class="game-picture">
                            <img
                                src="{{ url_for('static', filename='images/background.png') }}"
                                alt=""
                            >
                        </span>
                    </button>
                    <span class="perfect-label" aria-hidden="true">PERFECT</span>
                </div>

                <div class="game-slot" id="slot-terrible_ninja">
                    <button
                        type="button"
                        class="game-card game-card-ninja rank-redo"
                        onclick="launchGame('terrible_ninja')"
                        aria-label="Terrible Ninjaを開始">
                        <span class="game-picture">
                            <img
                                src="{{ url_for('static', filename='images/terrible_ninja_background1.png') }}"
                                alt=""
                            >
                        </span>
                    </button>
                    <span class="perfect-label" aria-hidden="true">PERFECT</span>
                </div>
            </div>
        </main>

        <nav class="launcher-dock" aria-label="メインメニュー">
            <button type="button" class="dock-item is-current" aria-current="page">
                <span class="dock-icon dock-game-icon">★</span>
                <span>ゲーム</span>
            </button>

            <a class="dock-item" href="/ranking/built_to_scale2">
                <span class="dock-icon dock-ranking-icon">♛</span>
                <span>ランキング</span>
            </a>

            <button type="button" id="logoutBtn" class="dock-item">
                <span class="dock-icon dock-logout-icon">↪</span>
                <span>ログアウト</span>
            </button>
        </nav>
    </div>

    <script>
        window.addEventListener("load", loadLauncher);

        async function loadLauncher() {
            document.getElementById("displayUsername").textContent =
                {{ username | tojson }};
            await loadGameRecords();
        }

        async function loadGameRecords() {
            try {
                const response = await fetch("/api/all_records");
                const data = await response.json();

                if (!data.success) {
                    return;
                }

                const games = data.records.games || {};
                showRecord("built_to_scale2", games.built_to_scale2, 5, 15);
                showRecord("terrible_ninja", games.terrible_ninja, 10, 20);
            } catch (error) {
                console.error("Error loading records:", error);
            }
        }

        function showRecord(gameName, record, highLevelMax, goodMax) {
            const slot = document.getElementById(`slot-${gameName}`);
            const card = slot.querySelector(".game-card");
            const bestMiss = record?.best_miss;

            card.classList.remove("rank-redo", "rank-good", "rank-high");
            slot.classList.remove("is-perfect");

            if (bestMiss === null || bestMiss === undefined || bestMiss > goodMax) {
                card.classList.add("rank-redo");
            } else if (bestMiss > highLevelMax) {
                card.classList.add("rank-good");
            } else {
                card.classList.add("rank-high");
            }

            if (bestMiss === 0) {
                slot.classList.add("is-perfect");
                card.setAttribute("aria-label", `${card.getAttribute("aria-label")}、パーフェクト`);
            }
        }

        function launchGame(gameName) {
            const gamePaths = {
                built_to_scale2: "/game/built_to_scale2",
                terrible_ninja: "/game/terrible_ninja"
            };

            if (gamePaths[gameName]) {
                window.location.href = gamePaths[gameName];
            }
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (!confirm("ログアウトしますか？")) {
                return;
            }

            try {
                await fetch("/api/logout", { method: "POST" });
                window.location.href = "/";
            } catch (error) {
                console.error("Error logging out:", error);
            }
        });
    </script>
</body>
</html>
