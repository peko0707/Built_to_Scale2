<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game - ランチャー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="launcher-body">
    <div class="launcher-container">
        <!-- ヘッダー -->
        <div class="launcher-header">
            <h1>Rhythm Game Launcher</h1>
            <div class="header-right">
                <span class="username-display">ユーザー: <strong id="displayUsername"></strong></span>
                <button id="logoutBtn" class="logout-btn">ログアウト</button>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="launcher-content">
            <!-- ゲームボタン -->
            <div class="games-section">
                <h2>ゲーム選択</h2>
                <div class="games-list">
                    <!-- Built to Scale 2 -->
                    <div class="game-card">
                        <div class="game-button" onclick="launchGame('built_to_scale2')">
                            <h3>Built to Scale 2</h3>
                            <p class="best-record" id="record-built_to_scale2"></p>
                        </div>
                    </div>

                    <!-- Terrible Ninja -->
                    <div class="game-card">
                        <div class="game-button" onclick="launchGame('terrible_ninja')">
                            <h3>Terrible Ninja</h3>
                            <p class="best-record" id="record-terrible_ninja"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ランキング -->
            <div class="ranking-section">
                <h2>ランキング</h2>
                <div class="ranking-box">
                    <a href="/ranking/built_to_scale2">
                        🏆 ランキング
                    </a>
            </div>
        </div>
    </div>

    <script>
        // ページ読み込み時にユーザー名と記録を表示
        window.addEventListener("load", async () => {
            const username = "{{ username }}";
            document.getElementById("displayUsername").textContent = username;
            
            // 各ゲームのrecordを取得
            await loadGameRecords();
        });

        async function loadGameRecords() {
            try {
                const response = await fetch("/api/all_records");
                const data = await response.json();
                
                if (data.success) {
                    const games = data.records.games || {};
                    
                    // Built to Scale 2のrecordを表示
                    const bs2Record = games.built_to_scale2;
                    if (bs2Record && bs2Record.best_miss !== null) {
                        document.getElementById("record-built_to_scale2").textContent = 
                            `ベスト: ${bs2Record.best_miss} miss`;
                    } else {
                        document.getElementById("record-built_to_scale2").textContent = "";
                    }

                    const terribleNinjaRecord = games.terrible_ninja;
                    if (terribleNinjaRecord && terribleNinjaRecord.best_miss !== null) {
                        document.getElementById("record-terrible_ninja").textContent =
                            `ベスト: ${terribleNinjaRecord.best_miss} miss`;
                    } else {
                        document.getElementById("record-terrible_ninja").textContent = "";
                    }
                }
            } catch (error) {
                console.error("Error loading records:", error);
            }
        }

        function launchGame(gameName) {
            if (gameName === "built_to_scale2") {
                window.location.href = "/game/built_to_scale2";
            } else if (gameName === "terrible_ninja") {
                window.location.href = "/game/terrible_ninja";
            }
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("ログアウトしますか？")) {
                try {
                    await fetch("/api/logout", { method: "POST" });
                    window.location.href = "/";
                } catch (error) {
                    console.error("Error logging out:", error);
                }
            }
        });
    </script>
</body>
</html>
