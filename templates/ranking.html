<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Built to Scale 2 - ランキング</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    h1 {
        margin-bottom: 30px;
    }

    #ranking {
        width: 90%;
        max-width: 600px;
        margin: 0 auto;
    }

    .ranking-item {
        display: flex;
        align-items: center;
        padding: 15px;
        margin: 10px 0;
        background: #222;
        border-radius: 10px;
        font-size: 20px;
    }

    .rank {
        width: 60px;
        font-weight: bold;
    }

    .username {
        flex: 1;
        text-align: left;
    }

    .miss {
        width: 120px;
        text-align: right;
    }

    .back-button {
        margin-top: 30px;
        padding: 12px 25px;
        font-size: 18px;
        cursor: pointer;
    }

    #error {
        color: #ff7777;
        margin-top: 20px;
    }
</style>


</head>

<body>


<h1>🏆 Built to Scale 2 ランキング</h1>

<div id="ranking">
    ランキングを読み込んでいます...
</div>

<div id="error"></div>

<button
    class="back-button"
    onclick="location.href='/launcher'">
    ランチャーに戻る
</button>


<script>

    async function loadRanking() {

        const rankingElement =
            document.getElementById("ranking");

        const errorElement =
            document.getElementById("error");

        try {

            const response =
                await fetch("/api/ranking/built_to_scale2");

            if (!response.ok) {
                throw new Error(
                    "ランキングAPIに接続できません"
                );
            }

            const data =
                await response.json();

            if (
                !data.success ||
                !Array.isArray(data.ranking)
            ) {
                throw new Error(
                    "ランキングデータが正しくありません"
                );
            }

            // ランキングを空にする
            rankingElement.innerHTML = "";

            // ランキングがまだない場合
            if (data.ranking.length === 0) {

                rankingElement.innerHTML =
                    "<p>まだランキングデータがありません。</p>";

                return;
            }

            // ランキングを表示
            data.ranking.forEach(function(player) {

                const item =
                    document.createElement("div");

                item.className =
                    "ranking-item";

                let rankText =
                    player.rank + "位";

                if (player.rank === 1) {
                    rankText = "🥇";
                } else if (player.rank === 2) {
                    rankText = "🥈";
                } else if (player.rank === 3) {
                    rankText = "🥉";
                }

                item.innerHTML = `
                    <div class="rank">
                        ${rankText}
                    </div>

                    <div class="username">
                        ${escapeHtml(player.username)}
                    </div>

                    <div class="miss">
                        ${player.best_miss} MISS
                    </div>
                `;

                rankingElement.appendChild(item);

            });

        } catch (error) {

            console.error(
                "ランキング読み込みエラー:",
                error
            );

            rankingElement.innerHTML =
                "";

            errorElement.textContent =
                "ランキングの読み込みに失敗しました。";
        }
    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;
    }


    // ページを開いたらランキング取得
    loadRanking();

</script>

</body>

</html>
